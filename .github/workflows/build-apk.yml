name: Build Android APK (Debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Java 17 é obrigatório com Gradle 8.0.x (usado pelo Capacitor 5).
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Build Vite (gerar dist/)
        run: npm run build

      - name: Adicionar plataforma Android
        run: npx cap add android || echo "Plataforma Android já existe"

      - name: Sincronizar Capacitor
        run: npx cap sync android

      # ── ÍCONES DO APK ──────────────────────────────────────────────────────
      # Copia todos os PNGs de resources/android/ para o projeto Android antes
      # do build, substituindo os ícones padrão gerados pelo Capacitor.
      #
      # Estratégia de dois níveis:
      #   1. PNGs legacy (ic_launcher.png) → usados em Android < 8.0 (API < 26)
      #      e como fallback universal.
      #   2. Ícone adaptativo (ic_launcher_background + foreground + monochrome
      #      + ic_launcher.xml) → usado em Android 8.0+ (API 26+) para efeito
      #      de forma dinâmica (círculo, squircle, etc.).
      #
      # NÃO removemos mipmap-anydpi-v26/ — ela contém o XML do ícone adaptativo
      # que aponta para background/foreground. Substituímos o XML pelos nossos e
      # os PNGs complementares ficam nas pastas de densidade corretas.
      - name: Aplicar ícones do app
        run: |
          echo "── Copiando PNGs por densidade ──"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            src="resources/android/mipmap-${density}"
            dst="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dst"
            for variant in ic_launcher ic_launcher_background ic_launcher_foreground ic_launcher_monochrome; do
              if [ -f "${src}/${variant}.png" ]; then
                cp "${src}/${variant}.png" "${dst}/${variant}.png"
                echo "  ✓ ${density}/${variant}.png"
              fi
            done
          done

          echo "── Copiando XML do ícone adaptativo ──"
          adaptive_src="resources/android/mipmap-anydpi-v26"
          adaptive_dst="android/app/src/main/res/mipmap-anydpi-v26"
          mkdir -p "$adaptive_dst"
          for xml_file in ic_launcher ic_launcher_round; do
            if [ -f "${adaptive_src}/${xml_file}.xml" ]; then
              cp "${adaptive_src}/${xml_file}.xml" "${adaptive_dst}/${xml_file}.xml"
              echo "  ✓ mipmap-anydpi-v26/${xml_file}.xml"
            fi
          done
          echo "── Ícones aplicados com sucesso ──"
      # ───────────────────────────────────────────────────────────────────────

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Permissão ao gradlew
        run: chmod +x android/gradlew

      - name: Build APK Debug
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: guia-doa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
